<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch POD — đếm ngược</title>
<style>
:root{
  --ink:#16181d; --ink-2:#5a6070; --ink-3:#8b91a1;
  --paper:#fbfaf7; --card:#ffffff; --line:#e6e3dc;
  --hot:#c0392b; --hot-bg:#fbeae7;
  --soon:#9a6b00; --soon-bg:#fdf3dd;
  --far:#20618a; --far-bg:#e8f1f7;
  --live:#1c7a5a; --live-bg:#e3f4ec;
  --dead:#8b91a1; --dead-bg:#f1efea;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.wrap.wide{max-width:1560px}
header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
input[type=search],select,button{
  font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);border-radius:8px;-webkit-appearance:none;appearance:none}
input[type=search]{flex:1 1 200px;min-width:0}
button{cursor:pointer}
button:hover{border-color:var(--ink-3)}
button:active{transform:scale(.99)}
.count{font-size:13px;color:var(--ink-3);margin:0 0 12px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.badge{flex:0 0 96px;text-align:center;font-size:13px;font-weight:600;
  padding:6px 4px;border-radius:8px;line-height:1.25}
.b-hot{background:var(--hot-bg);color:var(--hot)}
.b-soon{background:var(--soon-bg);color:var(--soon)}
.b-far{background:var(--far-bg);color:var(--far)}
.b-live{background:var(--live-bg);color:var(--live)}
.b-dead{background:var(--dead-bg);color:var(--dead)}
.body{min-width:0;flex:1}
.title{font-size:15px;word-break:break-word}
.meta{font-size:12.5px;color:var(--ink-3);margin-top:2px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;
  margin-right:6px;vertical-align:1px}
.t-red{background:#fbeae7;color:#b03a2e}
.t-yellow{background:#fdf3dd;color:#8a6100}
.t-green{background:#e3f4ec;color:#186b4f}
.t-none{background:#f1efea;color:#6b7180}
.msg{color:var(--ink-3);font-size:14px;padding:24px 0}
.err{color:var(--hot);font-size:14px;padding:16px;background:var(--hot-bg);border-radius:8px}
.err code{font-size:12.5px;word-break:break-all}
footer{margin-top:28px;font-size:12.5px;color:var(--ink-3)}

/* ==== Tab ==== */
.tabs{display:flex;gap:6px;margin:16px 0 4px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:14px;font-weight:600;padding:9px 16px;cursor:pointer;
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--ink-3);border-radius:0}
.tab:hover{color:var(--ink-2);border-color:var(--line)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}

/* ==== Dải 6 áo rank tốt nhất trên tab Lịch ==== */
.topmerch{border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:12px 14px;margin:18px 0 6px}
.top-h{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.05em}
.top-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.top-item{min-width:0;display:flex;flex-direction:column;gap:3px;text-decoration:none}
.top-thumb{background:#f4f2ee;border:1px solid var(--line);border-radius:8px;
  aspect-ratio:342/347;overflow:hidden;display:block}
.top-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.top-rank{color:var(--live);font-weight:700;font-size:14px;letter-spacing:-.01em}
.top-name{font-size:11.5px;line-height:1.35;color:var(--far);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top-item:hover .top-name{text-decoration:underline}
.top-note{margin:11px 0 0;padding-top:10px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-3)}
@media (max-width:620px){ .top-row{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* ==== Tab áo Merch ==== */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:none;border-radius:0;padding:9px 14px;background:none;color:var(--ink-2);font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--far-bg);color:var(--far);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;background:#f4f2ee;aspect-ratio:342/347}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.save{position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;
  border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);
  font-size:15px;line-height:1;color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.save.on{background:var(--hot);border-color:var(--hot);color:#fff}
.info{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px}
.rank{color:var(--live);font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.m-title{font-size:12.5px;line-height:1.35;color:var(--far);text-decoration:none;word-break:break-word}
.m-title:hover{text-decoration:underline}
.m-row{font-size:11.5px;color:var(--ink-2);word-break:break-word}
.m-row b{color:var(--ink);font-weight:600}
.asin{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-weight:600;color:var(--ink);font-size:11.5px}
.copy{border:none;background:none;padding:0 4px;font-size:12px;color:var(--ink-3);cursor:pointer}
.copy:hover{color:var(--ink)}
.age{font-size:11px;color:var(--ink-3);margin-top:2px}
.pick{position:absolute;z-index:50;width:230px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:10px 12px;font-size:13.5px}
.pick-h{font-weight:600;margin-bottom:6px}
.pick-ls{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.pick-ls label{display:flex;gap:8px;align-items:center;padding:4px 2px;cursor:pointer;word-break:break-word}
.pick-empty{color:var(--ink-3);font-size:12.5px;padding:2px 0 4px}
.pick-new{display:flex;gap:6px}
.pick-new input{flex:1 1 auto;min-width:0;font:inherit;font-size:13px;padding:6px 8px;
  border:1px solid var(--line);border-radius:6px}
.pick-new button{padding:6px 10px;font-size:13px}
#mfavlist.on,#mhide.on{background:var(--hot);border-color:var(--hot);color:#fff;font-weight:600}
.crumb{display:flex;align-items:center;gap:8px;font-size:15px;margin:4px 0 10px}
.crumb button{padding:6px 12px;font-size:13.5px}
.crumb b{font-weight:700}
.lcard{cursor:pointer;text-align:left;padding:0;font:inherit;width:100%;align-items:stretch;justify-content:flex-start}
.lcard:hover{border-color:var(--ink-3)}
.l-name{font-weight:600;font-size:14.5px;color:var(--ink);word-break:break-word}
.l-cnt{font-size:12.5px;color:var(--ink-3)}
.gone{font-size:12px;color:var(--ink-3);font-style:italic}
.excl{font-size:12.5px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;margin:8px 0 4px}
.excl b{color:var(--ink)}
@media (max-width:1300px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:900px){  .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:620px){  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} }
@media (max-width:480px){
  .wrap{padding:20px 14px 48px}
  h1{font-size:22px}
  .badge{flex-basis:80px;font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Lịch POD — đếm ngược</h1>
  <p class="sub" id="sub">Đang tải từ Google Calendar…</p>
</header>

<section class="topmerch" id="topmerch" hidden>
  <h2 class="top-h">6 áo rank tốt nhất</h2>
  <div class="top-row" id="topRow"></div>
  <p class="top-note">Click vào Tab Áo Merch để xem đầy đủ</p>
</section>

<div class="tabs">
  <button class="tab on" data-panel="cal">Lịch POD</button>
  <button class="tab" data-panel="merch">Áo Merch</button>
</div>

<section id="panel-cal">

<div class="controls">
  <input type="search" id="q" placeholder="Tìm theo tên, ví dụ: Halloween">
  <select id="phase">
    <option value="">Tất cả giai đoạn</option>
    <option>Lên idea</option>
    <option>Tăng ads</option>
    <option>Bán mạnh</option>
    <option selected>Tắt quảng cáo</option>
    <option>Hạ giá</option>
    <option>Collect data</option>
    <option>Khác</option>
  </select>
  <button id="sort">Gần nhất trước ↑</button>
  <button id="reload">Tải lại</button>
</div>

<p class="count" id="count"></p>
<ul id="list"></ul>

<footer id="foot"></footer>

</section>

<section id="panel-merch" hidden>

<div class="controls">
  <input type="search" id="mq" placeholder="Tìm theo tiêu đề, brand hoặc ASIN">
  <span class="seg" id="msort">
    <button class="on" data-by="rank">Rank</button>
    <button data-by="date">Ngày thêm</button>
  </span>
  <button id="mfavlist">Danh Sách Favorite</button>
  <button id="mhide">Ẩn áo trong list</button>
  <button id="mreload">Tải lại</button>
</div>

<p class="excl" id="mexcl" hidden></p>
<p class="count" id="mlistnote" hidden></p>
<div class="crumb" id="mcrumb" hidden></div>
<p class="count" id="mcount"></p>
<div class="grid" id="mgrid"></div>

<footer id="mfoot"></footer>

</section>

</div>

<script>
// ==== Dán link web app của Apps Script vào đây ====
var API_URL = "https://script.google.com/macros/s/AKfycbxpnSbkikGLdH0F2BPSTCMeV0EdVei0IVQYiqfKg6lekZarOxgm8CqPfjAIhsr09P_a2Q/exec";

// Cache trong trình duyệt, tính bằng phút. Đặt 0 nếu muốn luôn gọi mới.
var CACHE_MINUTES = 30;

(function(){
  var asc = true, DATA = [];
  var today = new Date(); today.setHours(0,0,0,0);

  var q = document.getElementById("q"),
      ph = document.getElementById("phase"),
      btn = document.getElementById("sort"),
      reload = document.getElementById("reload"),
      list = document.getElementById("list"),
      cnt = document.getElementById("count"),
      sub = document.getElementById("sub"),
      foot = document.getElementById("foot");

  function parse(d){ var p = d.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function diff(d){ return Math.round((parse(d) - today) / 86400000); }
  function vn(d){ var p = d.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function phaseOf(t){
    var s = t.toLowerCase();
    if (s.indexOf("lên idea") > -1) return "Lên idea";
    if (s.indexOf("tăng ads") > -1 || s.indexOf("chạy quảng cáo") > -1) return "Tăng ads";
    if (s.indexOf("bán mạnh") > -1) return "Bán mạnh";
    if (s.indexOf("tắt quảng cáo") > -1) return "Tắt quảng cáo";
    if (s.indexOf("hạ giá") > -1) return "Hạ giá";
    if (s.indexOf("collect data") > -1) return "Collect data";
    return "Khác";
  }

  function state(ev){
    var n = diff(ev.s);
    if (ev.e && n <= 0 && diff(ev.e) >= 0) return {k:"live", n:n, label:"Đang chạy"};
    if (n < 0) return {k:"dead", n:n, label:Math.abs(n) + " ngày trước"};
    if (n === 0) return {k:"hot", n:0, label:"Hôm nay"};
    if (n <= 7) return {k:"hot", n:n, label:"còn " + n + " ngày"};
    if (n <= 30) return {k:"soon", n:n, label:"còn " + n + " ngày"};
    return {k:"far", n:n, label:"còn " + n + " ngày"};
  }

  function render(){
    var term = q.value.trim().toLowerCase(), pick = ph.value;

    var rows = DATA.map(function(ev){
      return { ev: ev, st: state(ev), phase: phaseOf(ev.t) };
    }).filter(function(r){
      if (term && r.ev.t.toLowerCase().indexOf(term) < 0) return false;
      if (pick && r.phase !== pick) return false;
      return true;
    }).sort(function(a,b){ return asc ? a.st.n - b.st.n : b.st.n - a.st.n; });

    cnt.textContent = rows.length + " sự kiện";

    if (!rows.length){
      list.innerHTML = '<li class="msg">Không có sự kiện nào khớp. Thử xoá bớt bộ lọc.</li>';
      return;
    }

    list.innerHTML = rows.map(function(r){
      var ev = r.ev, st = r.st;
      var tag = ev.c ? '<span class="tag t-' + esc(ev.c) + '">' + esc(ev.c) + '</span>'
                     : '<span class="tag t-none">—</span>';
      var meta = vn(ev.s) + (ev.e ? " → " + vn(ev.e) : "") + (ev.time ? " · " + esc(ev.time) : "");
      return '<li>' +
        '<span class="badge b-' + st.k + '">' + st.label + '</span>' +
        '<span class="body"><span class="title">' + tag + esc(ev.t) + '</span>' +
        '<span class="meta">' + meta + '</span></span></li>';
    }).join("");
  }

  function cacheGet(){
    if (!CACHE_MINUTES) return null;
    try {
      var raw = localStorage.getItem("podcal");
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (Date.now() - o.at > CACHE_MINUTES * 60000) return null;
      return o;
    } catch(e){ return null; }
  }

  function cacheSet(data){
    try { localStorage.setItem("podcal", JSON.stringify({at: Date.now(), data: data})); }
    catch(e){}
  }

  function apply(data, cached){
    DATA = data.events || [];
    sub.textContent = "Số ngày còn lại tính theo hôm nay · dữ liệu " +
      (cached ? "từ bộ nhớ tạm" : "vừa tải") +
      (data.updated ? " (" + vn(data.updated) + ")" : "");
    foot.textContent = "Nguồn: Google Calendar qua Apps Script.";
    render();
  }

  function load(force){
    if (API_URL.indexOf("PASTE_YOUR") > -1){
      list.innerHTML = '<li class="err">Chưa cấu hình. Mở file này, tìm dòng ' +
        '<code>var API_URL</code> ở đầu thẻ script và dán link web app Apps Script vào.</li>';
      sub.textContent = "Chưa kết nối lịch";
      return;
    }

    if (!force){
      var c = cacheGet();
      if (c){ apply(c.data, true); return; }
    }

    list.innerHTML = '<li class="msg">Đang tải…</li>';

    // JSONP: nạp API như một file script để tránh lỗi CORS
    var name = "__podcal_" + Date.now();
    var script = document.createElement("script");
    var done = false;

    var timer = setTimeout(function(){
      if (done) return;
      done = true;
      cleanup();
      fail(new Error("Quá thời gian chờ (15 giây)"));
    }, 15000);

    function cleanup(){
      clearTimeout(timer);
      try { delete window[name]; } catch(e){ window[name] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    function fail(err){
      sub.textContent = "Không tải được lịch";
      var c = cacheGet();
      if (c){ apply(c.data, true); return; }
      list.innerHTML = '<li class="err">Không gọi được API. Kiểm tra: web app đã deploy ở chế độ ' +
        '<b>Anyone</b> chưa, và link có đuôi <code>/exec</code> không.<br><br>Lỗi: <code>' +
        esc(err.message) + '</code></li>';
    }

    window[name] = function(data){
      if (done) return;
      done = true;
      cleanup();
      cacheSet(data);
      apply(data, false);
    };

    script.onerror = function(){
      if (done) return;
      done = true;
      cleanup();
      fail(new Error("Không nạp được script từ API_URL"));
    };

    script.src = API_URL + (API_URL.indexOf("?") > -1 ? "&" : "?") +
      "callback=" + name + "&_=" + Date.now();
    document.head.appendChild(script);
  }

  btn.addEventListener("click", function(){
    asc = !asc;
    btn.textContent = asc ? "Gần nhất trước ↑" : "Xa nhất trước ↓";
    render();
  });
  reload.addEventListener("click", function(){ load(true); });
  q.addEventListener("input", render);
  ph.addEventListener("change", render);

  load(false);
})();


// ==== Tab áo Merch ====
(function(){
  var FAV_KEY = "podmerch_fav", LISTS_KEY = "podmerch_lists", CACHE_KEY = "podmerch_data";
  var MERCH_CACHE_MINUTES = 60;

  // Áo có tiêu đề hoặc brand chứa các từ khoá này bị loại khỏi lưới và dải 6 áo
  var EXCLUDE_KEYWORDS = ["Jeff Dunham", "Disney", "Marvel", "Harry Potter", "Dr. Seuss",
    "Hello Kitty", "House of 1000 Corpses", "SpongeBob", "Schoolhouse Rock", "Sesame Street",
    "Coca-Cola", "Project Hail Mary", "Peanuts Store", "Practical Magic",
    "TEENAGE MUTANT NINJA Store", "Olivia Rodrigo", "Cartoon Network", "Midnight Margaritas",
    "Dolly Parton", "IT Movie", "Brainrot", "Paw Patrol", "One Piece"];

  // LISTS: [{n: tên list, a: [ASIN...]}]. INFO: {ASIN: {t, u, i}} lưu kèm khi thả tim, để hiện
  // được cả áo đã rớt khỏi file data. view: "" = tất cả sản phẩm, "#" = các thẻ list,
  // số = chỉ số list đang mở.
  // HIDE: tên các list (chữ thường) có áo bị ẩn khỏi lưới tất cả sản phẩm
  var INFO_KEY = "podmerch_info", HIDE_KEY = "podmerch_hide";
  var DATA = [], sortBy = "rank", LISTS = [], INFO = {}, view = "", HIDE = [];
  var topReady = false, curTab = "cal";

  var q = document.getElementById("mq"),
      seg = document.getElementById("msort"),
      favListBtn = document.getElementById("mfavlist"),
      hideBtn = document.getElementById("mhide"),
      crumb = document.getElementById("mcrumb"),
      reload = document.getElementById("mreload"),
      grid = document.getElementById("mgrid"),
      cnt = document.getElementById("mcount"),
      foot = document.getElementById("mfoot"),
      exclBox = document.getElementById("mexcl");

  var today = new Date(); today.setHours(0,0,0,0);

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function num(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function ageOf(d){
    if (!d) return "";
    var p = d.split("-");
    if (p.length < 3) return "";
    var n = Math.round((today - new Date(+p[0], +p[1]-1, +p[2])) / 86400000);
    if (n < 0) return "sắp tới";
    if (n === 0) return "hôm nay";
    if (n === 1) return "hôm qua";
    return n + " ngày trước";
  }

  function dnum(d){
    if (!d) return 0;
    var p = d.split("-");
    return p.length < 3 ? 0 : (+p[0]) * 10000 + (+p[1]) * 100 + (+p[2]);
  }

  // Chuẩn hoá để so khớp theo nguyên từ, bỏ qua hoa/thường và dấu câu:
  // "Dr. Seuss" và "dr seuss" cùng thành " dr seuss ".
  function norm(s){
    return " " + String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim() + " ";
  }

  var EXCLUDE_NORM = EXCLUDE_KEYWORDS.map(norm);

  function excluded(it){
    var text = norm(it.t + " " + it.b);
    for (var i = 0; i < EXCLUDE_NORM.length; i++)
      if (text.indexOf(EXCLUDE_NORM[i]) > -1) return true;
    return false;
  }

  function listsLoad(){
    try { HIDE = JSON.parse(localStorage.getItem(HIDE_KEY) || "[]") || []; } catch(e){ HIDE = []; }
    try { INFO = JSON.parse(localStorage.getItem(INFO_KEY) || "{}") || {}; } catch(e){ INFO = {}; }
    try {
      var raw = localStorage.getItem(LISTS_KEY);
      if (raw){ LISTS = JSON.parse(raw) || []; return; }
      // Bản cũ chỉ có một danh sách yêu thích: chuyển sang list "Đã lưu"
      var old = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
      if (old.length){ LISTS = [{n: "Đã lưu", a: old}]; listsSave(); }
    } catch(e){ LISTS = []; }
  }

  function listsSave(){
    try {
      localStorage.setItem(LISTS_KEY, JSON.stringify(LISTS));
      localStorage.setItem(INFO_KEY, JSON.stringify(INFO));
    } catch(e){}
  }

  function inAnyList(asin){
    for (var i = 0; i < LISTS.length; i++)
      if (LISTS[i].a.indexOf(asin) > -1) return true;
    return false;
  }

  function findItem(asin){
    for (var i = 0; i < DATA.length; i++) if (DATA[i].a === asin) return DATA[i];
    return null;
  }

  // Các list đang được chọn ẩn (chỉ tính list còn tồn tại)
  function hiddenLists(){
    return LISTS.filter(function(l){ return HIDE.indexOf(l.n.toLowerCase()) > -1; });
  }

  // Áo trong một list: lấy từ data hiện tại, áo đã rớt khỏi data thì dựng lại từ INFO
  function listItems(l){
    return l.a.map(function(asin){
      var it = findItem(asin);
      if (it) return it;
      var o = INFO[asin] || {};
      return {a: asin, t: o.t || asin, u: o.u || "https://www.amazon.com/dp/" + asin,
              i: o.i || "", b: "", d: "", r: 0, gone: true};
    });
  }

  // Nút "Danh Sách Favorite" và thanh quay lại, theo view hiện tại
  function updateFav(){
    if (view !== "" && view !== "#" && !LISTS[+view]) view = "#";
    favListBtn.textContent = "Danh Sách Favorite (" + LISTS.length + ")";
    favListBtn.className = (view !== "") ? "on" : "";
    var nh = hiddenLists().length;
    hideBtn.textContent = "Ẩn áo trong list" + (nh ? " (" + nh + ")" : "");
    hideBtn.className = nh ? "on" : "";
    hideBtn.hidden = (view !== "");

    if (view === "" || view === "#"){ crumb.hidden = true; return; }
    crumb.innerHTML = '<button data-back="1">&#8592; Danh sách Favorite</button>' +
      '<span>/</span><b>' + esc(LISTS[+view].n) + '</b>';
    crumb.hidden = false;
  }

  // Các thẻ list (view "#"): ảnh mẫu đầu tiên, tên, số mẫu
  function renderLists(term){
    var idx = [];
    for (var i = 0; i < LISTS.length; i++)
      if (!term || LISTS[i].n.toLowerCase().indexOf(term) > -1) idx.push(i);

    cnt.textContent = idx.length + " list";
    if (!idx.length){
      grid.innerHTML = '<p class="msg">' + (LISTS.length
        ? "Không có list nào khớp."
        : "Chưa có list nào. Bấm trái tim trên một mẫu áo để tạo list đầu tiên.") + '</p>';
      return;
    }

    grid.innerHTML = idx.map(function(i){
      // Ảnh đại diện: mẫu đầu tiên trong list có ảnh
      var l = LISTS[i], items = listItems(l), src = "";
      for (var k = 0; k < items.length && !src; k++) src = items[k].i;
      var img = src
        ? '<img src="' + esc(src) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
        : '';
      return '<button class="card lcard" data-open="' + i + '">' +
        '<div class="thumb">' + img + '</div>' +
        '<div class="info"><span class="l-name">' + esc(l.n) + '</span>' +
        '<span class="l-cnt">' + l.a.length + ' mẫu</span></div></button>';
    }).join("");
  }

  function render(){
    var term = q.value.trim().toLowerCase();
    updateFav();
    if (view === "#"){ renderLists(term); return; }

    var src = (view === "") ? DATA : listItems(LISTS[+view]);
    var hl = (view === "") ? hiddenLists() : [], skip = {}, nHid = 0;
    hl.forEach(function(l){ l.a.forEach(function(a){ skip[a] = 1; }); });
    if (hl.length){
      src = src.filter(function(it){ return !skip[it.a]; });
      nHid = DATA.length - src.length;
    }
    var rows = src.filter(function(it){
      if (!term) return true;
      return (it.t + " " + it.b + " " + it.a).toLowerCase().indexOf(term) > -1;
    }).sort(function(a, b){
      if (sortBy === "rank") return (a.r || 9e9) - (b.r || 9e9);
      return dnum(b.d) - dnum(a.d);
    });

    cnt.textContent = rows.length + " sản phẩm" +
      (rows.length !== src.length ? " / " + src.length : "") +
      (hl.length ? " · đã ẩn " + nHid + " mẫu thuộc list: " +
        hl.map(function(l){ return l.n; }).join(", ") : "");

    if (!rows.length){
      grid.innerHTML = '<p class="msg">' + (src.length || view === ""
        ? "Không có sản phẩm nào khớp. Thử xoá bớt bộ lọc."
        : "List này chưa có mẫu nào.") + '</p>';
      return;
    }

    grid.innerHTML = rows.map(function(it){
      var on = inAnyList(it.a) ? " on" : "";
      var img = it.i
        ? '<img src="' + esc(it.i) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
        : '';
      var asin = it.a
        ? '<span class="m-row">ASIN: <span class="asin">' + esc(it.a) + '</span>' +
          '<button class="copy" data-copy="' + esc(it.a) + '" title="Chép ASIN">&#10697;</button></span>'
        : '';
      var brand = it.b ? '<span class="m-row">Brand: <b>' + esc(it.b) + '</b></span>' : '';

      return '<article class="card">' +
        '<div class="thumb">' + img +
          '<button class="save' + on + '" data-fav="' + esc(it.a) + '" ' +
          'title="Lưu vào list">&#9829;</button></div>' +
        '<div class="info">' +
          (it.gone
            ? '<span class="gone">Không còn trong data hiện tại</span>'
            : '<span class="rank">&#8593; ' + num(it.r || 0) + '</span>') +
          '<a class="m-title" href="' + esc(it.u) + '" target="_blank" rel="noopener">' +
            esc(it.t) + '</a>' +
          asin + brand +
          '<span class="age">' + esc(ageOf(it.d)) + '</span>' +
        '</div></article>';
    }).join("");
  }

  function cacheGet(){
    if (!MERCH_CACHE_MINUTES) return null;
    try {
      var o = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (!o || Date.now() - o.at > MERCH_CACHE_MINUTES * 60000) return null;
      return o;
    } catch(e){ return null; }
  }

  function cacheSet(data){
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({at: Date.now(), data: data})); }
    catch(e){}
  }

  // Dải 6 áo rank tốt nhất, nằm trên tab Lịch
  function renderTop(){
    var box = document.getElementById("topmerch"),
        row = document.getElementById("topRow");
    if (!box || !row) return;

    var top6 = DATA.slice().sort(function(a, b){
      return (a.r || 9e9) - (b.r || 9e9);
    }).slice(0, 6);

    topReady = top6.length > 0;
    if (!topReady){ syncTop(); return; }

    row.innerHTML = top6.map(function(it){
      var img = it.i
        ? '<img src="' + esc(it.i) + '" alt="" referrerpolicy="no-referrer">'
        : '';
      return '<a class="top-item" href="' + esc(it.u) + '" target="_blank" ' +
        'rel="noopener" title="' + esc(it.t) + '">' +
        '<span class="top-thumb">' + img + '</span>' +
        '<span class="top-rank">&#8593; ' + num(it.r || 0) + '</span>' +
        '<span class="top-name">' + esc(it.t) + '</span>' +
        '</a>';
    }).join("");

    syncTop();
  }

  // Dải này chỉ có nghĩa ở tab Lịch. Sang tab Áo Merch thì lưới ngay bên dưới
  // đã có đủ 300 áo, hiện lại 6 áo đầu là thừa.
  function syncTop(){
    var box = document.getElementById("topmerch");
    if (box) box.hidden = !(topReady && curTab === "cal");
  }

  function apply(data, cached){
    if (data.error){ showErr(data.error); return; }

    // Apps Script bản cũ không biết ?type=merch nên trả về data lịch.
    // Nhận diện để báo đúng bệnh, thay vì hiện "0 sản phẩm".
    if (!data.items){
      showErr("Apps Script đang chạy bản cũ, chưa có nhánh dữ liệu áo. " +
        "Vào Apps Script dán Code.gs mới, điền MERCH_FOLDER_ID, rồi Quản lý bản " +
        "triển khai → sửa → Phiên bản mới.");
      return;
    }

    var removed = 0;
    DATA = data.items.filter(function(it){
      if (excluded(it)){ removed++; return false; }
      return true;
    });
    exclBox.innerHTML = "Đã loại trừ các từ khóa này: <b>" +
      esc(EXCLUDE_KEYWORDS.join(", ")) + "</b>" +
      " (bỏ " + num(removed) + " sản phẩm)";
    exclBox.hidden = false;
    renderTop();
    foot.textContent = "Nguồn: " + (data.file || "CSV") + " trên Google Drive qua Apps Script" +
      (data.updated ? " · cập nhật " + data.updated : "") +
      (data.maxRank ? " · chỉ lấy rank ≤ " + num(data.maxRank) : "") +
      (data.skipped ? " (đã bỏ " + num(data.skipped) + "/" + num(data.total) + ")" : "") +
      (cached ? " · đọc từ bộ nhớ tạm" : "");
    render();
  }

  function showErr(msg){
    // Cho phép gọi lại khi mở tab lần sau. Không có dòng này thì sau một lần
    // lỗi, cờ loaded vẫn bật và thông báo lỗi nằm lì cho tới khi tải lại trang.
    loaded = false;
    grid.innerHTML = '<p class="err">' + esc(msg) + '</p>';
    cnt.textContent = "";
  }

  var loaded = false;

  function load(force){
    if (!force && loaded) return;
    loaded = true;

    if (!force){
      var c = cacheGet();
      if (c){ apply(c.data, true); return; }
    }

    grid.innerHTML = '<p class="msg">Đang tải…</p>';

    // JSONP: nạp API như một file script để tránh lỗi CORS
    var name = "__podmerch_" + Date.now();
    var script = document.createElement("script");
    var done = false;

    var timer = setTimeout(function(){
      if (done) return;
      done = true; cleanup();
      fail("Quá thời gian chờ (30 giây).");
    }, 30000);

    function cleanup(){
      clearTimeout(timer);
      try { delete window[name]; } catch(e){ window[name] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    function fail(msg){
      var c = cacheGet();
      if (c){ apply(c.data, true); return; }
      loaded = false;
      showErr("Không tải được data áo. " + msg +
        " Kiểm tra web app đã deploy chế độ Anyone và Code.gs đã điền MERCH_FOLDER_ID chưa.");
    }

    window[name] = function(data){
      if (done) return;
      done = true; cleanup();
      if (!data.error) cacheSet(data);
      apply(data, false);
    };

    script.onerror = function(){
      if (done) return;
      done = true; cleanup();
      fail("Không nạp được script từ API_URL.");
    };

    script.src = API_URL + (API_URL.indexOf("?") > -1 ? "&" : "?") +
      "type=merch&callback=" + name + "&_=" + Date.now();
    document.head.appendChild(script);
  }

  grid.addEventListener("click", function(e){
    // Bấm thẻ list → mở list đó
    var lc = e.target.closest ? e.target.closest("[data-open]") : null;
    if (lc){
      view = lc.getAttribute("data-open");
      q.value = "";
      render();
      return;
    }
    var f = e.target.closest ? e.target.closest("[data-fav]") : null;
    if (f){
      e.stopPropagation();
      if (pickBtn === f) closePickFlush(); else openPick(f);
      return;
    }
    var c = e.target.closest ? e.target.closest("[data-copy]") : null;
    if (c && navigator.clipboard){
      navigator.clipboard.writeText(c.getAttribute("data-copy"));
      var old = c.innerHTML;
      c.innerHTML = "&#10003;";
      setTimeout(function(){ c.innerHTML = old; }, 1000);
    }
  });

  seg.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-by]") : null;
    if (!b) return;
    sortBy = b.getAttribute("data-by");
    var all = seg.querySelectorAll("button");
    for (var i = 0; i < all.length; i++) all[i].className = (all[i] === b) ? "on" : "";
    render();
  });

  // ==== Bảng chọn list khi bấm trái tim ====
  var pick = null, pickBtn = null, pickAsin = "";

  function openPick(btn){
    closePick();
    closeHide();
    pickBtn = btn;
    pickAsin = btn.getAttribute("data-fav");
    pick = document.createElement("div");
    pick.className = "pick";
    document.body.appendChild(pick);
    drawPick();
    // Canh mép phải bảng theo nút, nhưng không để tràn ra ngoài màn hình
    var r = btn.getBoundingClientRect(),
        maxLeft = document.documentElement.clientWidth - pick.offsetWidth - 8;
    pick.style.left = (window.scrollX + Math.max(8, Math.min(r.right - pick.offsetWidth, maxLeft))) + "px";
    pick.style.top = (window.scrollY + r.bottom + 6) + "px";
    if (!LISTS.length) pick.querySelector("input[type=text]").focus();
  }

  function drawPick(){
    var html = '<div class="pick-h">Lưu vào list</div><div class="pick-ls">';
    if (!LISTS.length)
      html += '<div class="pick-empty">Chưa có list nào — tạo list đầu tiên bên dưới.</div>';
    for (var i = 0; i < LISTS.length; i++)
      html += '<label><input type="checkbox" data-li="' + i + '"' +
        (LISTS[i].a.indexOf(pickAsin) > -1 ? " checked" : "") + '>' + esc(LISTS[i].n) + '</label>';
    html += '</div><div class="pick-new"><input type="text" placeholder="Tên list mới" maxlength="60">' +
      '<button type="button">Tạo</button></div>';
    pick.innerHTML = html;
  }

  function closePick(){
    if (pick && pick.parentNode) pick.parentNode.removeChild(pick);
    pick = null; pickBtn = null; pickAsin = "";
  }

  // Sau mỗi thay đổi: lưu, tô lại trái tim, cập nhật số mẫu trong ô chọn list.
  // Đang xem theo list thì lọc lại lưới; nút trái tim cũ bị vẽ lại nên đóng bảng.
  function afterListChange(){
    listsSave();
    if (pickBtn) pickBtn.className = "save" + (inAnyList(pickAsin) ? " on" : "");
    updateFav();
    if (view !== ""){ closePick(); render(); }
    else if (HIDE.length) hideDirty = true;
  }

  // Áo vừa thả tim vào list đang ẩn: vẽ lại lưới sau khi đóng bảng chọn, không vẽ lúc
  // bảng còn mở để bảng không mất nút neo
  var hideDirty = false;
  function closePickFlush(){
    closePick();
    if (hideDirty){ hideDirty = false; render(); }
  }

  function createList(){
    var inp = pick.querySelector("input[type=text]"),
        name = inp.value.replace(/\s+/g, " ").trim();
    if (!name){ inp.focus(); return; }
    var idx = -1;
    for (var i = 0; i < LISTS.length; i++)
      if (LISTS[i].n.toLowerCase() === name.toLowerCase()){ idx = i; break; }
    if (idx < 0){ LISTS.push({n: name, a: []}); idx = LISTS.length - 1; }
    if (LISTS[idx].a.indexOf(pickAsin) < 0) LISTS[idx].a.push(pickAsin);
    syncOp("add", LISTS[idx].n, pickAsin);
    afterListChange();
    if (pick) drawPick();
  }

  document.addEventListener("click", function(e){
    if (!pick) return;
    if (pick.contains(e.target)){
      if (e.target.tagName === "BUTTON") createList();
      return;
    }
    closePickFlush();
  });

  document.addEventListener("change", function(e){
    if (!pick || !pick.contains(e.target) || !e.target.hasAttribute("data-li")) return;
    var l = LISTS[+e.target.getAttribute("data-li")];
    if (!l) return;
    var k = l.a.indexOf(pickAsin);
    if (e.target.checked && k < 0) l.a.push(pickAsin);
    if (!e.target.checked && k > -1) l.a.splice(k, 1);
    syncOp(e.target.checked ? "add" : "remove", l.n, pickAsin);
    afterListChange();
  });

  // ==== Đồng bộ list với Google Sheet "Merch Favorite List" qua Apps Script ====
  // Giao diện đổi ngay khi bấm; các thao tác được gửi lần lượt từng cái một để server
  // xử lý đúng thứ tự, rồi lấy trạng thái server trả về làm chuẩn.
  var SYNCED_KEY = "podmerch_lists_synced",
      noteEl = document.getElementById("mlistnote"),
      queue = [], busy = false;

  function listNote(msg){ noteEl.textContent = msg || ""; noteEl.hidden = !msg; }

  function jsonp(params, cb){
    var name = "__podlists_" + Date.now() + "_" + Math.floor(Math.random() * 1e6),
        script = document.createElement("script"), done = false, qs = [];
    var timer = setTimeout(function(){ finish({error: "Quá thời gian chờ."}); }, 30000);
    function finish(data){
      if (done) return;
      done = true; clearTimeout(timer);
      try { delete window[name]; } catch(e){ window[name] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      cb(data);
    }
    window[name] = finish;
    script.onerror = function(){ finish({error: "Không nạp được API."}); };
    for (var k in params) qs.push(k + "=" + encodeURIComponent(params[k]));
    script.src = API_URL + (API_URL.indexOf("?") > -1 ? "&" : "?") + qs.join("&") +
      "&callback=" + name + "&_=" + Date.now();
    document.head.appendChild(script);
  }

  function syncOp(op, list, asin){
    var it = findItem(asin);
    // Nhớ tiêu đề/link/ảnh để sau này áo rớt khỏi data vẫn hiện được trong list
    if (it && op === "add") INFO[asin] = {t: it.t, u: it.u, i: it.i};
    var o = INFO[asin] || {};
    queue.push({type: "lists", op: op, list: list, a: asin,
                t: o.t || "", u: o.u || "", i: o.i || ""});
    pump();
  }

  function syncGet(){
    queue.push({type: "lists", op: "get"});
    pump();
  }

  function pump(){
    if (busy || !queue.length) return;
    busy = true;
    var params = queue.shift();
    if (params.op !== "add"){ delete params.t; delete params.u; delete params.i; }
    jsonp(params, function(data){
      busy = false;
      if (params.op === "get") firstSync(data);
      // Còn thao tác đang chờ thì chưa lấy kết quả này, kẻo đè mất thay đổi vừa bấm
      if (!queue.length || !data || !data.lists) fromServer(data);
      pump();
    });
  }

  // Lần đầu nối được Sheet mà Sheet còn trống: đẩy các list đang có trên trình duyệt lên
  function firstSync(data){
    if (!data || !data.lists) return;
    var flag = null;
    try { flag = localStorage.getItem(SYNCED_KEY); localStorage.setItem(SYNCED_KEY, "1"); } catch(e){}
    if (flag || data.lists.length) return;
    for (var i = 0; i < LISTS.length; i++)
      for (var j = 0; j < LISTS[i].a.length; j++) syncOp("add", LISTS[i].n, LISTS[i].a[j]);
  }

  function fromServer(data){
    if (!data || !data.lists){
      listNote("Chưa đồng bộ Google Sheet — list đang lưu tạm trên trình duyệt này. " +
        (data && data.error ? "(" + data.error + ")" : "(Apps Script chưa deploy bản mới.)"));
      return;
    }
    listNote("");
    LISTS = data.lists;
    for (var a in (data.info || {})) if (!INFO[a]) INFO[a] = data.info[a];
    listsSave();
    updateFav();
    var hearts = grid.querySelectorAll("[data-fav]");
    for (var i = 0; i < hearts.length; i++)
      hearts[i].className = "save" + (inAnyList(hearts[i].getAttribute("data-fav")) ? " on" : "");
    // Bảng chọn đang mở: vẽ lại ô tick, trừ khi user đang gõ dở tên list mới
    if (pick && !pick.querySelector("input[type=text]").value) drawPick();
    if ((view !== "" || HIDE.length) && !pick) render();
    if (hidePop) drawHide();
  }

  document.addEventListener("keydown", function(e){
    if (!pick) return;
    if (e.key === "Escape") closePickFlush();
    else if (e.key === "Enter" && pick.contains(e.target) && e.target.type === "text") createList();
  });

  // Bấm nút: tất cả sản phẩm ⇄ các thẻ list
  favListBtn.addEventListener("click", function(){
    view = (view === "") ? "#" : "";
    q.value = "";
    render();
  });

  // ==== Bảng chọn list cần ẩn khỏi lưới tất cả sản phẩm ====
  var hidePop = null;

  function drawHide(){
    var html = '<div class="pick-h">Ẩn các áo thuộc list</div><div class="pick-ls">';
    if (!LISTS.length) html += '<div class="pick-empty">Chưa có list nào.</div>';
    for (var i = 0; i < LISTS.length; i++)
      html += '<label><input type="checkbox" data-hide="' + i + '"' +
        (HIDE.indexOf(LISTS[i].n.toLowerCase()) > -1 ? " checked" : "") + '>' +
        esc(LISTS[i].n) + ' (' + LISTS[i].a.length + ')</label>';
    hidePop.innerHTML = html + '</div>';
  }

  function closeHide(){
    if (hidePop && hidePop.parentNode) hidePop.parentNode.removeChild(hidePop);
    hidePop = null;
  }

  hideBtn.addEventListener("click", function(e){
    e.stopPropagation();
    if (hidePop){ closeHide(); return; }
    closePickFlush();
    hidePop = document.createElement("div");
    hidePop.className = "pick";
    document.body.appendChild(hidePop);
    drawHide();
    var r = hideBtn.getBoundingClientRect(),
        maxLeft = document.documentElement.clientWidth - hidePop.offsetWidth - 8;
    hidePop.style.left = (window.scrollX + Math.max(8, Math.min(r.left, maxLeft))) + "px";
    hidePop.style.top = (window.scrollY + r.bottom + 6) + "px";
  });

  document.addEventListener("click", function(e){
    if (hidePop && !hidePop.contains(e.target)) closeHide();
  });

  document.addEventListener("keydown", function(e){
    if (hidePop && e.key === "Escape") closeHide();
  });

  document.addEventListener("change", function(e){
    if (!hidePop || !hidePop.contains(e.target) || !e.target.hasAttribute("data-hide")) return;
    var l = LISTS[+e.target.getAttribute("data-hide")];
    if (!l) return;
    var key = l.n.toLowerCase(), k = HIDE.indexOf(key);
    if (e.target.checked && k < 0) HIDE.push(key);
    if (!e.target.checked && k > -1) HIDE.splice(k, 1);
    try { localStorage.setItem(HIDE_KEY, JSON.stringify(HIDE)); } catch(err){}
    render();
  });

  crumb.addEventListener("click", function(e){
    if (e.target.closest && e.target.closest("[data-back]")){ view = "#"; q.value = ""; render(); }
  });

  reload.addEventListener("click", function(){ load(true); });
  q.addEventListener("input", render);

  listsLoad();
  updateFav();
  syncGet();

  // Chuyển tab — chỉ tải data áo khi mở tab lần đầu
  var wrap = document.querySelector(".wrap"),
      tabs = document.querySelectorAll(".tab"),
      panels = { cal: document.getElementById("panel-cal"),
                 merch: document.getElementById("panel-merch") };

  for (var i = 0; i < tabs.length; i++){
    tabs[i].addEventListener("click", function(){
      var key = this.getAttribute("data-panel");
      for (var j = 0; j < tabs.length; j++)
        tabs[j].className = (tabs[j] === this) ? "tab on" : "tab";
      panels.cal.hidden = (key !== "cal");
      panels.merch.hidden = (key !== "merch");
      wrap.className = (key === "merch") ? "wrap wide" : "wrap";
      curTab = key;
      syncTop();
      if (key === "merch") load(false);
    });
  }

  // Tải sẵn để dải 6 áo hiện được ngay trên tab Lịch. Lần sau vào lại thì
  // đọc từ localStorage nên không tốn thêm lượt gọi Apps Script.
  load(false);
})();
</script>
</body>
</html>
